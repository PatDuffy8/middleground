<body>
<div class="app">

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => { t = Math.max(0, Math.round(t)); return Math.floor(t/60) + ":" + String(t%60).padStart(2, "0"); };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- State ---------- */
const LIB_KEY = "mg:library";
let videos = (store.get(LIB_KEY) || []).map(v => Object.assign({}, v, {type:"yt"}));
const persist = () => store.set(LIB_KEY, videos.filter(v => v.type === "yt"));
const cleanup = [];
function leave(){ cleanup.splice(0).forEach(f => { try { f(); } catch(e){} }); }

/* ---------- YouTube helpers ---------- */
function parseId(s){
  s = (s || "").trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(/^https?:/i.test(s) ? s : "https://" + s);
    const h = u.hostname.replace(/^www\.|^m\./, "");
    if (h === "youtu.be") return u.pathname.slice(1, 12) || null;
    if (h.endsWith("youtube.com")) {
      const v = u.searchParams.get("v");
      if (v) return v.slice(0, 11);
      const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{11})/);
      if (m) return m[2];
    }
  } catch(e){}
  return null;
}
function errMsg(code){
  return ({
    2:"That link isn't a valid YouTube video.",
    5:"YouTube couldn't play this video in the player.",
    100:"Video not found, or it is private.",
    101:"The owner of this video turned off embedding, so it can't be used here.",
    150:"The owner of this video turned off embedding, so it can't be used here.",
    153:"YouTube refused the embed. Open this site from its hosted web address, not from a file on your computer."
  })[code] || "YouTube couldn't load this video (error " + code + ").";
}
function withTimeout(p, ms, msg){
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(msg), ms))]);
}
const loadYT = () => withTimeout(window.ytReady, 8000, "Couldn't reach YouTube. Check your connection and reload.");

function fetchMeta(id){
  return loadYT().then(() => new Promise((res, rej) => {
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;left:-9999px;top:0;width:320px;height:180px";
    const inner = document.createElement("div");
    holder.appendChild(inner); document.body.appendChild(holder);
    let done = false, p, timer;
    const finish = (fn, val) => {
      if (done) return; done = true; clearInterval(timer);
      try { p.destroy(); } catch(e){}
      holder.remove(); fn(val);
    };
    p = new YT.Player(inner, {videoId:id, playerVars:{playsinline:1}, events:{
      onReady: () => {
        let n = 0;
        timer = setInterval(() => {
          const d = p.getDuration();
          if (d > 0) finish(res, {title:(p.getVideoData() || {}).title || "YouTube video", duration:d});
          else if (++n > 40) finish(rej, "Couldn't read this video's length.");
        }, 250);
      },
      onError: e => finish(rej, errMsg(e.data))
    }});
  }));
}

/* ---------- Splitting ---------- */
/* Cuts the whole video into back-to-back clips of L seconds. This runs every time a video is added. */
function splitVideo(v, d, L){
  if (!d) return;
  L = Math.min(120, Math.max(5, L || 30));
  const ms = [];
  for (let s = 0; s < d; s += L) {
    if (d - s < 3 && ms.length) { ms[ms.length-1].end = d; break; }
    ms.push({start:s, end:Math.min(s+L, d), title:"Part " + (ms.length+1)});
  }
  v.moments = ms; save(v);
}
function save(v){
  v.moments.sort((a,b) => a.start - b.start);
  if (v.type === "yt") persist();
}

/* ---------- YouTube Data API: search, suggestions, highlights ---------- */
const API = "https://www.googleapis.com/youtube/v3/";
const YT_API_KEY = ""; // optional: paste your key here once the site is hosted
const getKey = () => YT_API_KEY || store.get("mg:key") || "";

async function api(path, params){
  const key = getKey();
  if (!key) throw "no-key";
  const u = new URL(API + path);
  Object.entries(Object.assign({}, params, {key})).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw (j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || ("http" + r.status);
  return j;
}
function apiErr(e){
  if (typeof e === "string" && e.includes(" ")) return e;   // already a readable message
  return ({
    "no-key":"Add a YouTube API key to use search and suggestions.",
    quotaExceeded:"YouTube's daily limit for this key is used up. Try again tomorrow.",
    keyInvalid:"That API key isn't valid.",
    accessNotConfigured:"Turn on “YouTube Data API v3” for this key in Google Cloud.",
    ipRefererBlocked:"This key is restricted to other web addresses. Add this site's address to the key's allowed list."
  })[e] || ("YouTube request failed (" + e + ").");
}
function isoSec(s){
  const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || "");
  return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}
const mapItem = it => ({
  ytId: it.id, name: it.snippet.title, channel: it.snippet.channelTitle,
  duration: isoSec(it.contentDetails && it.contentDetails.duration),
  embeddable: !it.status || it.status.embeddable !== false
});
const usable = m => m.embeddable && m.duration >= 60;
async function getVideos(ids){
  const j = await api("videos", {part:"snippet,contentDetails,status", id:ids.join(","), maxResults:50});
  return (j.items || []).map(mapItem).filter(usable);
}
/* Highlights: find timestamps people write in comments ("3:42 best part") and cluster them */
async function findHighlights(ytId, duration){
  let items = [], tok;
  for (let i = 0; i < 3; i++) {
    const p = {part:"snippet", videoId:ytId, order:"relevance", maxResults:100, textFormat:"plainText"};
    if (tok) p.pageToken = tok;
    const j = await api("commentThreads", p);
    items = items.concat(j.items || []);
    tok = j.nextPageToken;
    if (!tok) break;
  }
  const hits = [];
  items.forEach(it => {
    const s = it.snippet.topLevelComment.snippet;
    const text = s.textDisplay || "";
    const w = 1 + Math.log2(1 + (s.likeCount || 0));
    for (const m of text.matchAll(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\b/g)) {
      if (+m[3] > 59 || (m[1] && +m[2] > 59)) continue;
      const t = (+m[1] || 0) * 3600 + (+m[2]) * 60 + (+m[3]);
      if (t >= duration) continue;
      hits.push({t, w, text});
    }
  });
  if (!hits.length) return null;

  const B = 10, n = Math.ceil(duration / B) + 2, raw = new Array(n).fill(0);
  hits.forEach(h => { raw[Math.floor(h.t / B)] += h.w; });
  const sm = raw.map((x, i) => x + 0.5 * (raw[i-1] || 0) + 0.5 * (raw[i+1] || 0));
  const want = Math.max(3, Math.min(10, Math.round(duration / 90)));
  const order = sm.map((s, i) => [s, i]).sort((a, b) => b[0] - a[0]);
  const peaks = [];
  for (const [s, i] of order) {
    if (s < 2 || peaks.length >= want) break;
    if (peaks.every(p => Math.abs(p - i) >= 4)) peaks.push(i);
  }
  if (peaks.length < 3) return null;

  const ms = peaks.map(i => {
    const near = hits.filter(h => h.t >= i * B - 10 && h.t < i * B + 20);
    const tw = near.reduce((a, h) => a + h.w, 0) || 1;
    const t = near.reduce((a, h) => a + h.t * h.w, 0) / tw;
    const best = near.slice().sort((a, b) => b.w - a.w)[0];
    const start = Math.max(0, Math.round(t - 8));
    const end = Math.min(duration, start + 25);
    let title = ((best && best.text) || "").replace(/(?:\d{1,2}:)?\d{1,2}:\d{2}/g, "").replace(/\s+/g, " ").trim();
    if (title.length > 70) title = title.slice(0, 67).trim() + "…";
    return {start, end, title: title || "Moment viewers flagged", fan: true};
  }).sort((a, b) => a.start - b.start);
  return ms;
}
async function buildMoments(v, strict){
  let ms = null, err = null;
  try { ms = await findHighlights(v.ytId, v.duration); } catch(e) { err = e; }
  if (ms) { v.moments = ms; save(v); return true; }
  if (strict) throw (err ? apiErr(err) : "Not enough timestamped comments on this video to find highlights.");
  splitVideo(v, v.duration, 30);
  return false;
}
async function openVideo(meta){
  if (meta.src) {   /* free-to-reuse file hosted by its archive: plain video, no player ads */
    const v = {type:"file", id:"src:" + meta.src, url:meta.src, name:meta.name, duration:meta.duration, credit:meta.credit, featured:true, cat:meta.cat,
      moments:(meta.moments || []).map(([s, e, t]) => ({start:s, end:Math.min(e, meta.duration), title:t || "Highlight"}))};
    return feed(v);
  }
  let v = videos.find(x => x.ytId === meta.ytId);
  if (!v) {
    let duration = meta.duration, name = meta.name;
    if (!duration) { const m = await fetchMeta(meta.ytId); duration = m.duration; name = name || m.title; }
    v = {type:"yt", id:"yt:" + meta.ytId, ytId:meta.ytId, name:name, duration, moments:[], featured:!!meta.featured, cat:meta.cat};
    videos.unshift(v);
  }
  if (meta.moments) v.moments = meta.moments.map(([s, e, t]) => ({start:s, end:Math.min(e, v.duration), title:t || "Highlight"}));
  if (!v.moments.length) await buildMoments(v, false);
  persist();
  feed(v);
}

function say(t, err){
  const m = $("#msg"); if (!m) return;
  m.textContent = t ? (err ? "Error: " : "") + t : ""; m.className = err ? "err" : "";
}
function card(m, onClick){
  const b = document.createElement("button"); b.className = "tile" + (m.src ? " file" : "");
  const reel = (m.moments || []).reduce((a, x) => a + (x.end - x.start), 0);
  const len = reel && m.duration ? "Reel " + fmt(reel) + " of " + fmt(m.duration) : (m.duration ? fmt(m.duration) : "");
  const sub = [m.credit ? esc(m.credit) : (m.channel ? esc(m.channel) : ""), len].filter(Boolean).join(" · ");
  b.innerHTML = `<div class="thumb"><img loading="lazy" src="${m.thumb ? esc(m.thumb) : "https://i.ytimg.com/vi/" + m.ytId + "/mqdefault.jpg"}" alt=""></div>
    <b>${m.src ? `<span class="adfree">Ad-free</span> ` : ""}${esc(m.name || "Loading title…")}</b>${sub ? `<span class="meta">${sub}</span>` : ""}`;
  b.onclick = onClick;
  return b;
}

  say("Finding the best moments…");
  const all = () => document.querySelectorAll("#main .tile, #main #addBtn");
  all().forEach(t => { t.disabled = true; });

  catch(e) { say(apiErr(e), true); all().forEach(t => { t.disabled = false; }); }
}

const CATCOL = {"Sports":"#4ade80", "TV & Film":"#fb923c", "News":"#f87171", "Educational":"#a78bfa", "Business":"#fbbf24", "Tech & Science":"#38bdf8", "Outdoors":"#2dd4bf", "Comedy":"#facc15", "Entertainment":"#f472b6", "Gaming":"#818cf8", "Music":"#e879f9", "Featured":"#ffffff"};
const ROW_ORDER = ["Sports", "TV & Film", "News", "Educational", "Business", "Tech & Science", "Outdoors", "Comedy", "Entertainment", "Gaming", "Music", "Featured"];
const YT_CATS = {"17":"Sports", "1":"TV & Film", "25":"News", "27":"Educational", "28":"Tech & Science", "23":"Comedy", "24":"Entertainment", "20":"Gaming", "10":"Music"};
function renderRows(){
  const host = $("#rows"); if (!host) return;
  host.innerHTML = "";
  const groups = {};
  /* popular YouTube picks first, ad-free files after them, inside each category */
  FEATURED.filter(f => !f.src).concat(FEATURED.filter(f => f.src)).forEach(f => { const c = ROW_ORDER.includes(f.cat) ? f.cat : "Featured"; (groups[c] = groups[c] || []).push(f); });
  ROW_ORDER.filter(c => groups[c]).forEach(c => {
    const sec = document.createElement("section"); sec.style.cssText = "display:grid;gap:12px";
    sec.style.setProperty("--accent", CATCOL[c] || "#fff");
    sec.innerHTML = `<div class="rowhead"><h3>${esc(c)}</h3><span class="meta">${groups[c].length}</span></div><div class="shelf"></div>`;
    groups[c].forEach(f => {
      const t = card(f, () => pick(Object.assign({}, f, {featured:true})));
      sec.querySelector(".shelf").appendChild(t);
      if (!f.name) fillTitle(f, t);
    });
    host.appendChild(sec);
  });
}
async function autoCategorize(){
  const need = FEATURED.filter(f => !f.cat);
  if (!need.length || !getKey()) return;
  try {
    const j = await api("videos", {part:"snippet", id:need.map(f => f.ytId).join(","), maxResults:50});
    const by = {}; (j.items || []).forEach(it => { by[it.id] = YT_CATS[it.snippet.categoryId] || "Featured"; });
    need.forEach(f => { f.cat = by[f.ytId] || "Featured"; });
    renderRows();
  } catch(e) {}
}
function fillTitle(f, el){
  const set = t => { const b = el.querySelector("b"); if (b) b.textContent = t; };
  fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + f.ytId))
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { f.name = j.title; set(j.title); })
    .catch(() => set("YouTube video"));
}

        <form class="urlform" id="keyForm"><input id="key" type="text" autocomplete="off" placeholder="API key" aria-label="API key"><button class="btn" type="submit">${hasKey ? "Replace key" : "Save key"}</button>${hasKey ? `<button class="btn danger" id="clearKey" type="button">Remove key</button>` : ""}</form>
      </div></details></div>
    <p class="note">Ad-free videos are public-domain files that play with no ads. Popular videos and reels you build from YouTube links play in YouTube's own player: views and ads still go to the creator, and some creators turn off embedding.</p>
  </div>`;

  ["sug", "diy"].forEach(k => {
    $("#tab-" + k).onclick = () => showTab(k);
    $("#tab-" + k).onkeydown = e => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const o = k === "sug" ? "diy" : "sug"; showTab(o); $("#tab-" + o).focus(); }
    };
  });
  showTab(homeTab);
  renderRows();
  autoCategorize();
  const mine = videos.filter(v => !v.featured);
  if (mine.length) {
    $("#libsec").hidden = false;
    mine.forEach(v => $("#lib").appendChild(card(v, () => pick(v))));
  }

  $("#keyForm").onsubmit = e => {
    e.preventDefault();
    const k = $("#key").value.trim();
    if (k) { store.set("mg:key", k); home(); }
  };
  const ck = $("#clearKey");
  if (ck) ck.onclick = () => { try { localStorage.removeItem("mg:key"); } catch(e){} home(); };

  $("#addForm").onsubmit = async e => {
    e.preventDefault();
    const raw = $("#url").value.trim();
    if (!raw) return;
    const id = parseId(raw);
    if (!id) return say("That doesn't look like a YouTube link.", true);
    const have = videos.find(v => v.ytId === id);
    if (have) return pick(have);
    $("#addBtn").disabled = true; say("Loading video…");
    try {
      let meta;
      if (getKey()) {
        meta = (await getVideos([id]))[0];
        if (!meta) throw "That video can't be embedded, or it is under a minute long.";
      } else {
        const m = await fetchMeta(id);
        meta = {ytId:id, name:m.title, duration:m.duration};
      }
      say("Finding the best moments…");
      await openVideo(meta);
    } catch(err) { say(apiErr(err), true); $("#addBtn").disabled = false; }
  };
}

/* ---------- Moments editor ---------- */
function edit(v){
  leave();
  $("#main").innerHTML = `<div class="wrap wide">
    <div class="row" style="justify-content:space-between"><h1>${esc(v.name)}</h1>
      <button class="btn primary" id="go">Open feed</button></div>
    <div class="editor">
      <div style="display:grid;gap:12px;min-width:0;align-content:start">
        <div class="player" id="ed">${v.type === "file" ? `<video id="vid" src="${v.url}" controls playsinline></video>` : `<div id="edslot"></div>`}</div>
        <div class="row">
          <button class="btn" id="mark">Mark clip here (10s)</button>
          <button class="btn" id="hl">Find highlights</button>
          <button class="btn" id="copyf">Copy as featured entry</button>
          <button class="btn" id="resplit">Re-split</button>
          <label class="meta" for="len">Clip length</label>
          <input id="len" type="number" min="5" max="120" value="30" style="width:64px;background:var(--panel);border:1px solid var(--line);border-radius:0;padding:6px">
          <span class="meta">sec</span>
        </div>
        <div class="note" id="hlmsg" role="status"></div>
        <div><button class="btn danger" id="remove">Remove from library</button></div>
      </div>
      <div style="display:grid;gap:10px;align-content:start;min-width:0"><h2>Clips</h2><div class="list" id="list"></div></div>
    </div></div>`;

  let ctl;
  if (v.type === "file") {
    const vid = $("#vid");
    ctl = {time:() => vid.currentTime, seek:t => { vid.currentTime = t; }, dur:() => vid.duration};
    const ready = () => { v.duration = vid.duration; if (!v.moments.length) { splitVideo(v, vid.duration, 30); list(v, ctl); } };
    vid.onloadedmetadata = ready;
    if (vid.readyState >= 1) ready();
  } else {
    let player;
    ctl = {time:() => (player && player.getCurrentTime) ? player.getCurrentTime() : 0,
           seek:t => { if (player && player.seekTo) player.seekTo(t, true); },
           dur:() => v.duration};
    loadYT().then(() => {
      if (!$("#edslot")) return;
      player = new YT.Player("edslot", {width:"100%", height:"100%", videoId:v.ytId, playerVars:{playsinline:1, rel:0},
        events:{onError:e => { $("#ed").outerHTML = `<div class="empty">${esc(errMsg(e.data))}</div>`; }}});
    }).catch(msg => { $("#ed").outerHTML = `<div class="empty">${esc(msg)}</div>`; });
    cleanup.push(() => { try { player && player.destroy(); } catch(e){} });
  }

  $("#mark").onclick = () => {
    const t = ctl.time(), d = ctl.dur() || t + 10;
    v.moments.push({start:t, end:Math.min(t + 10, d), title:"Clip at " + fmt(t)});
    save(v); list(v, ctl);
  };
  const resplit = () => { splitVideo(v, ctl.dur(), +$("#len").value); list(v, ctl); };
  $("#resplit").onclick = resplit;
  $("#copyf").onclick = async () => {
    const txt = `{ytId:${JSON.stringify(v.ytId)}, name:${JSON.stringify(v.name)}, moments:${JSON.stringify(v.moments.map(m => [Math.round(m.start), Math.round(m.end), m.title]))}},`;
    try { await navigator.clipboard.writeText(txt); $("#hlmsg").textContent = "Copied. Paste it into the FEATURED list in index.html."; }
    catch(e) { $("#hlmsg").textContent = txt; }
  };
  $("#hl").onclick = async () => {
    const b = $("#hl"); b.disabled = true; b.textContent = "Searching…"; $("#hlmsg").textContent = "";
    try { await buildMoments(v, true); list(v, ctl); }
    catch(e) { $("#hlmsg").textContent = apiErr(e); }
    b.disabled = false; b.textContent = "Find highlights";
  };
  $("#len").onchange = resplit;
  $("#go").onclick = () => feed(v);
  $("#remove").onclick = () => {
    videos = videos.filter(x => x !== v); persist(); home();
  };
  list(v, ctl);
}
function list(v, ctl){
  const el = $("#list"); if (!el) return;
  el.innerHTML = "";
  $("#go").disabled = !v.moments.length;
  if (!v.moments.length) {
    el.innerHTML = `<div class="empty">No clips yet. They appear as soon as the video loads.</div>`;
    return;
  }
  v.moments.forEach((m, i) => {
    const r = document.createElement("div"); r.className = "m";
    r.innerHTML = `<button class="n" aria-label="Jump to ${fmt(m.start)}">${fmt(m.start)}</button>
      <input value="${esc(m.title)}" aria-label="Clip title"><button class="x" aria-label="Remove clip">×</button>`;
    r.querySelector("input").oninput = e => { m.title = e.target.value; save(v); };
    r.querySelector(".n").onclick = () => ctl.seek(m.start);
    r.querySelector(".x").onclick = () => { v.moments.splice(i, 1); save(v); list(v, ctl); };
    el.appendChild(r);
  });
}

/* ---------- Feed ---------- */
const vkey = x => x.ytId || (((x.url || x.src || "").match(/download\/([^/]+)\//) || [])[1]) || "";
let startClip = null;
function shareLink(v, i){ return location.origin + location.pathname + "#watch/" + encodeURIComponent(vkey(v)) + "/" + i; }
async function shareIt(btn, v, i, text){
  const url = shareLink(v, i), label = btn.textContent;
  try { if (navigator.share) { await navigator.share({title:"Middleground", text, url}); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; } catch(e){}
  if (!ok) { try { const t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove(); } catch(e){} }
  btn.textContent = ok ? "Link copied" : url;
  setTimeout(() => { btn.textContent = label; }, 2200);
}
function feed(v){
  leave();
  $("#main").innerHTML = `<div class="feedwrap">
    <div class="feedtop"><button class="pill" id="back">← Clips</button>${`<button class="pill on" id="auto" aria-pressed="true" title="Move to the next clip when one ends">Auto-advance: on</button>`}<span class="pill meta" id="count"></span></div>
    <div class="feed" id="feed"></div></div>`;
  $("#back").onclick = () => edit(v);
  const f = $("#feed");
  v.moments.forEach((m, i) => {
    const c = document.createElement("section"); c.className = "card"; c.dataset.i = i;
    if (v.cat && CATCOL[v.cat]) c.style.setProperty("--accent", CATCOL[v.cat]);
    c.innerHTML = `<div class="col"><div class="box">${v.type === "file" ? `<video src="${v.url}" playsinline controls preload="metadata"></video>` : `<div class="slot"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.ytId}/hqdefault.jpg"></div>`}</div>
      <div class="cap"><span class="src">${v.type === "file" ? "Ad-free · " : ""}${esc(v.name)} · ${fmt(m.start)}–${fmt(m.end)}${v.credit ? " · " + esc(v.credit) : ""}${m.fan ? " · viewer pick" : ""}</span><h3>${esc(m.title)}</h3><div class="bar"><span></span></div><button class="sharebtn" type="button">Share this clip</button></div></div>`;
    f.appendChild(c);
  });
  const reel = v.moments.reduce((a, m) => a + (m.end - m.start), 0);
  const count = i => {
    $("#count").textContent = (i + 1) + " / " + v.moments.length + " · " + fmt(reel) + " of " + fmt(v.duration || 0);
    if (v.featured) { try { history.replaceState(null, "", "#watch/" + encodeURIComponent(vkey(v)) + "/" + i); } catch(e){} }
  };
  count(0);

  const isYT = v.type !== "file";
  const cards = [...f.children];
  const shareBtns = [...f.querySelectorAll(".sharebtn")];
  shareBtns.forEach((b, i) => { b.onclick = () => shareIt(b, v, i, v.moments[i].title + " (" + v.name + ")"); });
  /* End card: every reel has an end. Say so, and offer what to watch next. */
  const endEl = document.createElement("section"); endEl.className = "endcard";
  endEl.innerHTML = `<div><span class="mark">End of reel</span><h3>That's the reel.</h3>
    <p>${v.moments.length} moments, ${fmt(reel)} of a ${fmt(v.duration || 0)} video. Nothing left to scroll.</p>
    <div class="row"><button class="btn primary" id="again" type="button">Watch again</button><button class="btn" id="endhome" type="button">All videos</button><button class="btn" id="endshare" type="button">Share this reel</button></div>
    ${v.featured ? `<h2 style="margin-top:8px">Up next</h2><div class="grid" id="nextgrid"></div>` : ""}</div>`;
  f.appendChild(endEl);
  endEl.querySelector("#again").onclick = () => f.scrollTo({top:0, behavior:"smooth"});
  endEl.querySelector("#endhome").onclick = () => home();
  endEl.querySelector("#endshare").onclick = e => shareIt(e.currentTarget, v, 0, "The best moments of " + v.name);
  if (v.featured) {
    const me = vkey(v);
    FEATURED.filter(x => vkey(x) !== me).sort((a, b) => (b.cat === v.cat) - (a.cat === v.cat) || (!!a.src - !!b.src)).slice(0, 3).forEach(x => {
      const t = card(x, () => openVideo(Object.assign({}, x, {featured:true})));
      if (x.cat && CATCOL[x.cat]) t.style.setProperty("--accent", CATCOL[x.cat]);
      endEl.querySelector("#nextgrid").appendChild(t);
    });
  }
  let cur = -1, last = 0, loaded = -1, seen = false, wait = null, tick = null, auto = true, base = 100;
  /* One shared YouTube player, reused for every clip: switching clips is a seek, not a new iframe. */
  let SP = null, spReady = false, spHost = null;
  const place = i => {                 /* park the player over clip i's box; it lives inside the feed so it scrolls and wheel-scrolls with it */
    if (!spHost || !cards[i]) return;
    last = i;
    const fr = f.getBoundingClientRect(), r = cards[i].querySelector(".box").getBoundingClientRect();
    spHost.style.left = (r.left - fr.left + f.scrollLeft) + "px"; spHost.style.top = (r.top - fr.top + f.scrollTop) + "px";
    spHost.style.width = r.width + "px"; spHost.style.height = r.height + "px";
  };
  const fail = msg => {
    if (spHost) spHost.style.visibility = "hidden";
    const s = cards[cur >= 0 ? cur : last].querySelector(".slot"); if (s) s.innerHTML = `<div class="empty" style="margin:16px">${esc(msg)}</div>`;
  };
  function initPlayer(){
    if (!isYT || SP || !v.moments.length) return;
    spHost = document.createElement("div"); spHost.className = "sp"; spHost.style.opacity = "0";
    const inner = document.createElement("div"); spHost.appendChild(inner); f.appendChild(spHost); place(0);
    loadYT().then(() => {
      if (!spHost) return;
      const m0 = v.moments[0];
      SP = new YT.Player(inner, {width:"100%", height:"100%", videoId:v.ytId,
        playerVars:{playsinline:1, rel:0, modestbranding:1, iv_load_policy:3, start:Math.floor(m0.start)},
        events:{
          onReady: () => { spReady = true; if (cur >= 0 && loaded !== cur) play(cur); },
          onStateChange: ev => { if (cur >= 0 && ev.data === YT.PlayerState.ENDED) ended(cur); },
          onError: ev => fail(errMsg(ev.data))
        }});
    }).catch(fail);
  }
  function play(i){
    if (!spReady) return;                 /* onReady will start it */
    const m = v.moments[i]; loaded = i; seen = false;
    try { SP.seekTo(m.start, true); SP.playVideo(); } catch(x){}   /* seek, not loadVideoById: loadVideoById with an end time won't autoplay */
  }
  function ended(i){
    const next = cards[i + 1] || endEl;
    if (auto && next) { try { SP.pauseVideo(); } catch(x){} next.scrollIntoView({behavior:"smooth", block:"start"}); return; }
    play(i);
  }
  function stopCur(){
    clearTimeout(wait); clearInterval(tick);
    if (cur >= 0) {
      cards[cur].classList.remove("on");
      if (isYT && spReady) { try { SP.pauseVideo(); SP.setVolume(base); } catch(x){} }
      const vd = cards[cur].querySelector("video"); if (vd) { vd.pause(); vd.ontimeupdate = null; }
      const bx = cards[cur].querySelector(".box"); if (bx) bx.style.opacity = "";
    }
    cur = -1; loaded = -1;
  }
  /* 1 in the middle of a clip, easing to 0 over the first 0.5s and last 0.7s */
  const fadeAt = (t, m) => Math.max(0, Math.min(1, (t - m.start) / 0.5 + 0.15, (m.end - t) / 0.7));
  function activate(card){
    const i = +card.dataset.i;
    if (cur === i) return;
    stopCur();
    cur = i; card.classList.add("on");
    const m = v.moments[i], bar = card.querySelector(".bar span");
    bar.style.width = "0";
    if (!isYT) {
      const vd = card.querySelector("video"), box = card.querySelector(".box");
      let base = vd.volume;
      vd.currentTime = m.start; vd.play().catch(() => {});
      tick = setInterval(() => {      /* soft fade in/out so a clip never ends on a hard cut */
        const t = vd.currentTime;
        bar.style.width = Math.max(0, Math.min(100, (t - m.start) / (m.end - m.start) * 100)) + "%";
        const f = fadeAt(t, m);
        box.style.opacity = f;
        if (f >= 1) base = vd.volume; else vd.volume = base * f;
        if (t >= m.end) {
          const next = cards[i + 1] || endEl;
          vd.volume = base; box.style.opacity = "";
          if (auto && next) { vd.pause(); next.scrollIntoView({behavior:"smooth", block:"start"}); }
          else vd.currentTime = m.start;
        }
      }, 60);
      const nx = cards[i + 1] && cards[i + 1].querySelector("video"); if (nx) nx.preload = "auto";
      return;
    }
    /* Move the shared player onto this card (hidden until the clip is really playing), then seek it to the clip. */
    place(i); spHost.style.visibility = ""; spHost.style.opacity = "0";
    wait = setTimeout(() => {
      if (cur !== i) return;
      if (loaded !== i) play(i);
      tick = setInterval(() => {
        if (!spReady) return;
        try {
          place(i);
          const t = SP.getCurrentTime();
          bar.style.width = Math.max(0, Math.min(100, (t - m.start) / (m.end - m.start) * 100)) + "%";
          if (t >= m.start - 1 && t < m.end) seen = true;
          if (seen && t >= m.end - 0.05) { seen = false; ended(i); return; }   /* end the clip ourselves */
          const fd = fadeAt(t, m);
          spHost.style.opacity = fd;
          if (fd >= 1) base = SP.getVolume(); else SP.setVolume(base * fd);
        } catch(x){}
      }, 100);
    }, 80);
  }

  const autoBtn = $("#auto");
  if (autoBtn) autoBtn.onclick = () => {
    auto = !auto;
    autoBtn.textContent = "Auto-advance: " + (auto ? "on" : "off");
    autoBtn.classList.toggle("on", auto); autoBtn.setAttribute("aria-pressed", String(auto));
  };

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { count(+e.target.dataset.i); activate(e.target); }
    else if (cur === +e.target.dataset.i) stopCur();
  }), {root:f, threshold:[.6]});
  cards.forEach(c => io.observe(c));
  if (startClip != null) { const c = cards[Math.min(startClip, cards.length - 1)]; startClip = null; if (c) c.scrollIntoView({block:"start"}); }
  if (isYT) initPlayer();                                  /* start loading the player right away */
  else { const v0 = cards[0] && cards[0].querySelector("video"); if (v0) v0.preload = "auto"; }
  const onResize = () => place(last);
  window.addEventListener("resize", onResize);
  cleanup.push(() => { stopCur(); try { SP && SP.destroy(); } catch(x){} if (spHost) spHost.remove(); spHost = null; SP = null; window.removeEventListener("resize", onResize); io.disconnect(); });
}

$("#home").onclick = home;
const bootHash = location.hash;
home();
(function(){   /* shared links: #watch/<video>/<clip> open straight into that clip */
  const m = /^#watch\/([^/]+)\/(\d+)$/.exec(bootHash); if (!m) return;
  const f = FEATURED.find(x => vkey(x) === decodeURIComponent(m[1])); if (!f) return;
  startClip = +m[2];
  openVideo(Object.assign({}, f, {featured:true})).catch(() => { startClip = null; });
})();
</script>
